name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install kaleido (optional — PNG chart export)
        run: pip install "kaleido>=0.2.1" || echo "kaleido install failed — chart PNG export disabled, tests unaffected"

      - name: Run tests
        run: pytest tests/ -v
